<h2>비밀번호 변경</h2>
<p class="explanation">비밀번호를 변경 하실 수 있습니다.</p>
<form style="margin-top:30px;" method="POST" action="{% url 'user:change_password' %}">
    {% csrf_token %}
    {% if form.errors %}
        <div class="error">
        {% for field, errors in form.errors.items %}
            {% for error in errors %}
                <div style="margin-top: 4px;">{{ error }}</div>
            {% endfor %}
        {% endfor %}
        </div>
    {% endif %}
    <input type="password" name="old_password" placeholder="기존 비밀번호" autocomplete="current-password" />
    <input type="password" name="new_password1" placeholder="새 비밀번호" autocomplete="current-password" />
    <input type="password" name="new_password2" placeholder="새 비밀번호 확인" autocomplete="current-password" />
    <button type="submit" class="btn">비밀번호 변경</button>
</form>
