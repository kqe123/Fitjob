<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>로그인</title>
  <style>
    :root{
      --blue:#1f66ff;
      --text:#111;
      --muted:#666;
      --line:#e6e8ee;
      --bg:#f6f7fb;
      --card:#fff;
      --radius:14px;
      --shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    a{color:inherit; text-decoration:none}
    .wrap{min-height:100vh; display:flex; flex-direction:column}

    /* Top bar */
    .topbar{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:18px;
      padding:0 24px;
      color:var(--muted);
      font-size:14px;
    }

    /* Main */
    .main{
      flex:1;
      display:flex;
      justify-content:center;
      padding:12px 16px 28px;
    }
    .container{
      width:min(1100px, 100%);
    }

    /* Hero title */
    .hero{
      text-align:center;
      padding:10px 0 18px;
    }
    .hero .tagline{
      font-size:18px;
      font-weight:700;
      letter-spacing:-.4px;
      margin-bottom:10px;
    }
    .brand{
      display:inline-flex;
      align-items:baseline;
      gap:10px;
      font-weight:900;
      letter-spacing:-1px;
    }
    .brand .blue{
      color:var(--blue);
      font-size:48px;
      line-height:1;
    }
    .brand .orange{
      color:#ff6a00;
      font-size:40px;
      line-height:1;
    }

    /* Panel */
    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow: var(--shadow);
      padding:26px;
    }

    .grid{
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap:22px;
      align-items:stretch;
    }

    /* Login Card */
    .login-card{
      border:1px solid var(--line);
      border-radius:16px;
      padding:18px;
    }
    .tabs{
      display:flex;
      border:1px solid var(--line);
      border-radius:12px;
      overflow:hidden;
      width:100%;
      margin-bottom:14px;
      background:#fafbff;
    }
    .tab{
      flex:1;
      padding:12px 10px;
      text-align:center;
      font-weight:700;
      font-size:14px;
      color:var(--muted);
      cursor:pointer;
      user-select:none;
    }
    .tab.active{
      background:#fff;
      color:var(--text);
      box-shadow: inset 0 -2px 0 var(--blue);
    }

    .form-row{
      display:flex;
      gap:12px;
      align-items:stretch;
    }
    .fields{flex:1; display:flex; flex-direction:column; gap:10px}
    .field{
      display:flex;
      align-items:center;
      gap:10px;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px 12px;
      background:#fff;
    }
    .icon{
      width:34px; height:34px;
      display:grid; place-items:center;
      border-radius:10px;
      background:#f1f4ff;
      color:var(--blue);
      font-weight:900;
      font-size:14px;
      flex:0 0 auto;
    }
    input{
      width:100%;
      border:0;
      outline:none;
      font-size:14px;
      background:transparent;
    }

    .btn{
      width:140px;
      border:0;
      border-radius:12px;
      background:var(--blue);
      color:#fff;
      font-weight:800;
      font-size:15px;
      cursor:pointer;
    }
    .btn:active{transform: translateY(1px)}
    .options{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:10px;
      font-size:12px;
      color:var(--muted);
    }
    .toggle{
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .pill{
      border:1px solid var(--line);
      border-radius:999px;
      padding:4px 10px;
      background:#fff;
      font-weight:800;
      color:var(--blue);
      font-size:12px;
    }

    .social{
      display:flex;
      justify-content:center;
      gap:10px;
      padding:16px 0 6px;
    }
    .sbtn{
      width:40px; height:40px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      display:grid; place-items:center;
      cursor:pointer;
      font-weight:900;
      color:#111;
    }
    .links{
      display:flex;
      justify-content:center;
      gap:14px;
      font-size:13px;
      color:var(--muted);
      padding-bottom:2px;
    }
    .links a:hover{color:var(--blue)}

    /* Banner */
    .banner{
      border-radius:16px;
      overflow:hidden;
      border:1px solid var(--line);
      background: linear-gradient(135deg, #0f4fff, #2aa7ff);
      position:relative;
      min-height:320px;
      padding:18px;
      color:#fff;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      opacity:.95;
      font-size:14px;
    }
    .search{
      margin-top:12px;
      display:flex;
      align-items:center;
      gap:8px;
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.25);
      border-radius:999px;
      padding:10px 12px;
      max-width: 320px;
      backdrop-filter: blur(6px);
    }
    .search input{color:#fff}
    .search input::placeholder{color:rgba(255,255,255,.8)}
    .big{
      font-weight:900;
      letter-spacing:-.8px;
      line-height:1.15;
      font-size:36px;
      margin-top:18px;
    }
    .coins{
      position:absolute;
      right:-18px;
      bottom:-18px;
      width:220px;
      height:220px;
      border-radius:999px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), rgba(255,255,255,.08));
      filter: blur(.2px);
      opacity:.9;
    }
    .banner small{opacity:.9}

    /* Partner strip */
    .partners{
      margin-top:18px;
      display:grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap:14px;
      align-items:center;
      text-align:center;
      color:var(--muted);
      font-size:13px;
    }
    .partner{
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      padding:16px 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,.05);
    }
    .partner b{color:#222}

    /* Footer */
    footer{
      text-align:center;
      color:#9aa1ad;
      font-size:12px;
      padding:18px 0 22px;
    }

    /* Responsive */
    @media (max-width: 920px){
      .grid{grid-template-columns:1fr}
      .btn{width:100%}
      .form-row{flex-direction:column}
      .banner{min-height:260px}
      .partners{grid-template-columns:1fr; text-align:left}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <a href="#">잡코리아앱</a>
      <a href="#">고객센터</a>
    </div>

    <main class="main">
      <div class="container">
        <div class="hero">
          <div class="tagline">세상 모든 커리어는 <span style="font-weight:900;">하나로</span> 통한다!</div>
          <div class="brand" aria-label="브랜드">
            <div class="blue">잡코리아</div>
            <div class="orange">알바몬</div>
          </div>
        </div>

        <section class="panel">
          <div class="grid">
            <!-- LEFT: Login -->
            <div class="login-card">
              <div class="tabs" role="tablist" aria-label="회원 구분">
                <div class="tab active" role="tab" aria-selected="true">개인회원</div>
                <div class="tab" role="tab" aria-selected="false">기업회원</div>
              </div>

              <form>
                <div class="form-row">
                  <div class="fields">
                    <div class="field">
                      <div class="icon">ID</div>
                      <input type="text" placeholder="NO.1 잡코리아+알바몬 통합 ID" autocomplete="username" />
                    </div>
                    <div class="field">
                      <div class="icon">PW</div>
                      <input type="password" placeholder="비밀번호" autocomplete="current-password" />
                    </div>
                  </div>
                  <button class="btn" type="submit">로그인</button>
                </div>

                <div class="links">
                  <a href="#">아이디 찾기</a>
                  <a href="#">비밀번호 찾기</a>
                  <a href="#" style="color:var(--blue); font-weight:800;">회원가입</a>
                </div>
              </form>
            </div>

            <!-- RIGHT: Banner -->
            <aside class="banner">
              <div>
                <div class="badge">삼성화재 N잡코루</div>
                <div class="search">
                  <span style="font-weight:900;">🔎</span>
                  <input type="text" placeholder="잡(JOB)왔다, 새로운 기회" />
                </div>
                <div class="big">
                  쉽고 편하게<br />
                  N잡으로 보험해!
                </div>
              </div>
              <small>프로모션 배너 영역 (이미지로 교체 가능)</small>
              <div class="coins" aria-hidden="true"></div>
            </aside>
          </div>
        </section>

        <div class="partners">
          <div class="partner">
            <div><b>대한민국 ICT</b>를 움직이는 기업</div>
            <div>★ KT 파트너 온라인 채용관 ★</div>
          </div>
          <div class="partner">
            <div style="font-size:12px; color:#9aa1ad;">디지털 혁신을 이끄는</div>
            <div style="font-size:20px; font-weight:900; color:#d81b60;">LG CNS 협력회사</div>
            <div style="font-size:18px; font-weight:900; color:#222;">온라인 채용관</div>
          </div>
          <div class="partner">
            <div>쉽고 편하게 N잡으로 보험해!</div>
            <div style="font-weight:900;">삼성화재 N잡코루</div>
          </div>
        </div>

        <footer>© Worxphere LLC. All Rights Reserved.</footer>
      </div>
    </main>
  </div>

  <script>
    // 탭 UI 간단 동작 (보기용)
    const tabs = document.querySelectorAll(".tab");
    tabs.forEach(t => t.addEventListener("click", () => {
      tabs.forEach(x => x.classList.remove("active"));
      t.classList.add("active");
    }));
  </script>
</body>
</html>
